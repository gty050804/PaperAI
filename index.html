<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaperAI — 论文阅读笔记</title>
  <meta name="description" content="记录与管理学术论文阅读笔记">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="logo">
        <span class="logo-icon">📄</span>
        <div>
          <h1>PaperAI</h1>
          <p class="tagline">论文阅读笔记</p>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-view="list">阅读列表</button>
        <button class="nav-btn" data-view="add">添加论文</button>
        <button class="nav-btn" data-view="stats">统计</button>
      </nav>
    </div>
  </header>

  <main class="main container">
    <!-- 阅读列表视图 -->
    <section id="view-list" class="view active">
      <div class="toolbar">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input type="search" id="search-input" placeholder="搜索标题、作者、关键词…">
        </div>
        <div class="filter-group">
          <select id="filter-status">
            <option value="">全部状态</option>
            <option value="reading">阅读中</option>
            <option value="finished">已读完</option>
            <option value="to-read">待读</option>
          </select>
          <select id="filter-tag">
            <option value="">全部标签</option>
          </select>
        </div>
      </div>
      <div id="paper-list" class="paper-list"></div>
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">📚</div>
        <h3>还没有论文记录</h3>
        <p>点击「添加论文」开始记录你的第一篇阅读笔记</p>
        <button class="btn btn-primary" onclick="switchView('add')">添加论文</button>
      </div>
    </section>

    <!-- 添加/编辑论文视图 -->
    <section id="view-add" class="view">
      <div class="form-card">
        <h2 id="form-title">添加论文</h2>
        <form id="paper-form">
          <input type="hidden" id="paper-id">
          <div class="form-row">
            <div class="form-group flex-2">
              <label for="title">论文标题 *</label>
              <input type="text" id="title" required placeholder="例如：Attention Is All You Need">
            </div>
            <div class="form-group">
              <label for="status">阅读状态</label>
              <select id="status">
                <option value="to-read">待读</option>
                <option value="reading">阅读中</option>
                <option value="finished">已读完</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="authors">作者</label>
              <input type="text" id="authors" placeholder="Vaswani et al.">
            </div>
            <div class="form-group">
              <label for="year">年份</label>
              <input type="number" id="year" min="1900" max="2099" placeholder="2017">
            </div>
            <div class="form-group">
              <label for="venue">发表 venue</label>
              <input type="text" id="venue" placeholder="NeurIPS, arXiv…">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group flex-2">
              <label for="url">链接</label>
              <input type="url" id="url" placeholder="https://arxiv.org/abs/...">
            </div>
            <div class="form-group">
              <label for="read-date">阅读日期</label>
              <input type="date" id="read-date">
            </div>
          </div>
          <div class="form-group">
            <label for="tags">标签（逗号分隔）</label>
            <input type="text" id="tags" placeholder="Transformer, NLP, 深度学习">
          </div>
          <div class="form-group">
            <label for="summary">摘要 / 核心观点</label>
            <textarea id="summary" rows="3" placeholder="用几句话概括论文的核心贡献…"></textarea>
          </div>
          <div class="form-group">
            <label for="notes">详细笔记</label>
            <textarea id="notes" rows="8" placeholder="方法细节、实验结果、个人思考…"></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" id="btn-cancel">取消</button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>
      </div>
    </section>

    <!-- 统计视图 -->
    <section id="view-stats" class="view">
      <h2>阅读统计</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-value" id="stat-total">0</span>
          <span class="stat-label">总计</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-finished">0</span>
          <span class="stat-label">已读完</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-reading">0</span>
          <span class="stat-label">阅读中</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-toread">0</span>
          <span class="stat-label">待读</span>
        </div>
      </div>
      <div class="stats-section">
        <h3>热门标签</h3>
        <div id="tag-cloud" class="tag-cloud"></div>
      </div>
      <div class="stats-section">
        <h3>数据管理</h3>
        <div class="data-actions">
          <button class="btn btn-secondary" id="btn-export">导出 JSON</button>
          <label class="btn btn-secondary">
            导入 JSON
            <input type="file" id="import-file" accept=".json" hidden>
          </label>
          <button class="btn btn-danger" id="btn-clear">清空所有数据</button>
        </div>
        <p class="hint">数据保存在浏览器本地。导出后可备份或迁移到其他设备。</p>
      </div>
    </section>
  </main>

  <!-- 论文详情模态框 -->
  <dialog id="detail-modal" class="modal">
    <div class="modal-content">
      <button class="modal-close" aria-label="关闭">&times;</button>
      <div id="modal-body"></div>
    </div>
  </dialog>

  <footer class="footer">
    <div class="container">
      <p>PaperAI · 论文阅读笔记 · <a href="https://github.com" target="_blank" rel="noopener">GitHub Pages</a></p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
